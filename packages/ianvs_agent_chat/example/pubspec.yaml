name: agent_chat_demo
description: Standalone host for the reusable Agent Chat UI and LLM adapter.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  ianvs_design: ^0.3.1
  flutter:
    sdk: flutter
  ianvs_agent_chat:
    path: ..
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

# Shared UI polish fixes; use hosted resolution after release.
dependency_overrides:
  ianvs_design:
    git:
      url: https://github.com/robinfai/ianvs-design.git
      ref: e926049e8bbe64b66efb61be5a4c93ed7638c211
