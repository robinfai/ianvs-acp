name: ianvs_acp
description: "Shift：切换工作方式，把任务交给 Agent。基于 Flutter 和 ACP 的 macOS 桌面应用。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  cupertino_icons: ^1.0.8
  ianvs_design: ^0.4.0
  ianvs_acp_runtime:
    path: packages/ianvs_acp_runtime
  ianvs_agent_chat:
    path: packages/ianvs_agent_chat
  flutter:
    sdk: flutter

  file_picker: ^10.2.0
  flutter_markdown_plus: ^1.0.7
  mcp_dart: ^1.3.0
  ianvs_terminal_core: ^0.1.0
  mime: ^2.0.0
  merman: ^0.7.0
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  markdown: ^7.3.1
  path: ^1.9.1
  ffi: ^2.2.0
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.30.0
  desktop_drop: ^0.7.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  config:
    # Merman 0.7.0 uses CocoaPods; see packages/ianvs_agent_chat/README.md.
    enable-swift-package-manager: false

  uses-material-design: true
