name: macOS verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ianvs-acp
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_ARCHIVE_URL: >-
        https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.44.8-stable.zip
      FLUTTER_ARCHIVE_SHA256: c3d6fe95078f7001d947a31d42527de91d5bfe62e4cf444a1493a2e8f1fb199d
      FLUTTER_FRAMEWORK_REVISION: 058e0af2c2b57e369d905a03ac9748b0ebf543c6
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: ianvs-acp

      - name: Check out sibling terminal core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: robinfai/ianvs-terminal
          ref: 2fbf85aae1c4db45231d675b251925e1edf0f9ad
          path: ianvs-terminal
          persist-credentials: false

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter_macos_arm64_3.44.8-stable.zip"
          sdk_parent="$RUNNER_TEMP/flutter-sdk"
          curl --fail --proto '=https' --tlsv1.2 --location \
            --retry 5 --retry-all-errors \
            --output "$archive" "$FLUTTER_ARCHIVE_URL"
          printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$archive" \
            | shasum -a 256 -c -
          mkdir -p "$sdk_parent"
          /usr/bin/unzip -q "$archive" -d "$sdk_parent"
          flutter_root="$sdk_parent/flutter"
          printf 'FLUTTER_ROOT=%s\n' "$flutter_root" >>"$GITHUB_ENV"
          printf '%s\n' "$flutter_root/bin" >>"$GITHUB_PATH"

      - name: Verify Flutter toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          version_json=$(flutter --version --machine)
          test "$(printf '%s' "$version_json" | jq -r .frameworkVersion)" = '3.44.8'
          test "$(printf '%s' "$version_json" | jq -r .frameworkRevision)" \
            = "$FLUTTER_FRAMEWORK_REVISION"

      - name: Install verified Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.90.0
          rustc --version
          cargo --version

      - name: Resolve Dart dependencies
        run: make bootstrap

      - name: Check app, chat package and example formatting
        run: make format-check

      - name: Prepare generated macOS build inputs
        run: flutter build macos --config-only --no-pub

      - name: Install locked CocoaPods dependencies
        run: pod install --deployment --project-directory=macos

      - name: Analyze
        run: make analyze

      - name: Test release script safety contracts
        run: ./tool/release_scripts_test.sh

      - name: Verify Rust runtime and FFI integration
        run: ./tool/verify_rust_runtime.sh

      - name: Test app, chat package and example offline with isolated HOME
        run: make test

      - name: Build standalone chat example
        working-directory: ianvs-acp/packages/ianvs_agent_chat/example
        run: flutter build macos --debug --no-pub

      - name: Test native macOS host
        run: >-
          xcodebuild test -quiet
          -workspace macos/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build local ad-hoc release
        run: flutter build macos --release --no-pub

      - name: Verify local release bundle
        run: >-
          ./tool/verify_macos_bundle.sh
          'build/macos/Build/Products/Release/Shift.app'
