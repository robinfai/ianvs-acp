[workspace]
members = [
  "crates/ianvs-acp-core",
  "crates/ianvs-acp-ffi",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
agent-client-protocol = "=1.2.0"
async-process = "2.5.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures = "0.3.31"
nix = { version = "=0.28.0", features = ["term"] }
portable-pty = "=0.9.0"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.20.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
